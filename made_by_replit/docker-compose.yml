services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: beez
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: beez_studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beez -d beez_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      LOG_LEVEL: info
      DATABASE_URL: postgres://beez:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/beez_studio
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-server

volumes:
  pgdata:
