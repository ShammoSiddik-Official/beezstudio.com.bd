# Single entrypoint for beezstudio.example — replace with your real domain
# via the reverse proxy / load balancer in front of this container, or
# terminate TLS here if this is your edge (see DEPLOYMENT.md).

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # ---- API (proxied to the api-server container) ----
    location /api/ {
        proxy_pass http://api-server:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # The chatbot uses Server-Sent Events — do not buffer.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # ---- Admin console (BeeZ Studio Console), single-page app ----
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- Static assets: long cache ----
    location ~* ^/(?!admin/).*\.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|ico)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* ^/admin/.*\.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|ico)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Public site (BeeZ Studio), single-page app ----
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
