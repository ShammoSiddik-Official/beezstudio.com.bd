kind = "web"
previewPath = "/"
title = "Beez Studio"
version = "1.0.0"
id = "artifacts/beez-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25020

[services.development]
run = "pnpm --filter @workspace/beez-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/beez-studio", "run", "build" ]
publicDir = "artifacts/beez-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25020"
BASE_PATH = "/"
